name: Prepare owner code review
on:
  pull_request:
    types: [labeled]
permissions: {}
jobs:
  request:
    if: github.event.label.name == 'prepare-owner-review' && github.actor_id == '250909943' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'prepare/owner-approved-prebuilt'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Submit exact candidate for owner review as GitHub automation
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          const sha=process.env.REVIEW_SHA, repository=process.env.REPOSITORY;
          if(!/^[a-f0-9]{40}$/.test(sha) || repository!=='baldvinodds-creator/cadenza-release-control')throw Error('Unexpected review source');
          const api=async(path,method='GET',body)=>{
            const r=await fetch(`https://api.github.com/repos/${repository}/${path}`,{method,redirect:'error',signal:AbortSignal.timeout(30000),headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,accept:'application/vnd.github+json','content-type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});
            if(!r.ok)throw Error(`Review preparation refused (${r.status}); inspect before retry`);
            return r.json();
          };
          const branch=`owner-review/${sha}`;
          await api('git/refs','POST',{ref:`refs/heads/${branch}`,sha});
          const pr=await api('pulls','POST',{base:'main',head:branch,draft:true,title:'Review single-owner protected release configuration',body:`Review the exact candidate ${sha}. This request is submitted by GitHub automation so the existing sole human owner can review it under unchanged CODEOWNERS protection. No owner approval has been supplied, no credentials attached, and no deployment enabled. Source implementation: Cadenza PR #1147. The owner must approve before merge.`});
          console.log(JSON.stringify({reviewUrl:pr.html_url,headSha:sha,ownerApprovalSupplied:false,deploymentEnabled:false}));
          JS
